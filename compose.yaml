services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////data/app.db
      WHISPER_DOWNLOAD_ROOT: /models
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - database:/data
      - speech_models:/models
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 30s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:80"
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  database:
  speech_models:
